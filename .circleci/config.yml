version: 2.1

# CI runs the Makefile's targets so that CI and a local `make check` agree.

executors:
  python:
    docker:
      - image: cimg/python:3.12.7

jobs:
  test:
    # The package declares requires-python >= 3.11, so the suite runs on every supported
    # minor version: 3.11 (the oldest), 3.12, and 3.13 (the one local development uses).
    parameters:
      python:
        type: string
    docker:
      - image: cimg/python:<< parameters.python >>
    steps:
      - checkout
      - run:
          name: Install every package and the dev tools
          command: make install
      - run:
          name: Run every package's tests and the workspace tests
          command: make test

  lint:
    executor: python
    steps:
      - checkout
      - run:
          name: Install every package and the dev tools
          command: make install
      - run:
          name: ruff check and format check
          command: make lint
      - run:
          name: mypy --strict
          command: make typecheck
      - run:
          name: codespell
          command: make spell
      - run:
          name: Dependency boundaries
          command: make boundaries
      - run:
          name: Layout map
          command: make layout

  no-session-links:
    executor: python
    steps:
      - checkout
      - run:
          name: Reject session links in commit messages and tracked files
          # The patterns live in the script (also a pre-commit hook); --require-base fails the
          # job if origin/main cannot be fetched instead of skipping the commit messages.
          command: |
            git fetch --quiet origin main:refs/remotes/origin/main
            scripts/check_no_session_links.sh --require-base

workflows:
  checks:
    jobs:
      - test:
          matrix:
            parameters:
              python: ["3.11.14", "3.12.7", "3.13.9"]
      - lint
      - no-session-links
