# Workspace root for mailroom-dojo. Not a package itself: it holds shared tool config.
# Each package lives under packages/ and is installed on its own, e.g.
#   pip install -e "packages/record[dev,analysis]"

[tool.pytest.ini_options]
testpaths = ["packages/record/tests", "packages/labels/tests", "packages/dojo/tests"]
addopts = "--import-mode=importlib"
# Lets tests import shared helpers from packages/<pkg>/tests/<pkg>_testkit.py.
pythonpath = ["packages/record/tests", "packages/labels/tests", "packages/dojo/tests"]
