[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailroom-common"
version = "0.1.0"
description = "Shared foundation for the Mailroom packages: errors, hashing, JSONL IO, config loading, logging, model-client interface, plugin registry."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "hypothesis"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mailroom_common = ["py.typed"]
