[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailroom-dojo"
version = "0.1.0"
description = "Deterministic scoring for the Mailroom: field-type scorers, label folding and client scoring profiles."
readme = "README.md"
requires-python = ">=3.11"
# Every dependency is required: a missing one is an import error, never a quiet change
# of algorithm (jellyfish for name similarity, scipy and numpy for list matching,
# python-dateutil for dates, PyYAML for scoring profiles). scipy and numpy are core by the
# owner's decision (2026-11-19). NumPy 2 is the floor: its scalar promotion (NEP 50) and
# scalar repr are what the statistics code and its tests rely on (a float32 alpha keeps
# float32 arithmetic; an error names np.float64(nan)), and the parity corpora were captured
# with NumPy 2; scipy 1.13 is the first release built for NumPy 2.
dependencies = [
    "python-dateutil>=2.8",
    "jellyfish>=1.0",
    "scipy>=1.13",
    "numpy>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Optional similarity backend for embedding rescue; never used unless a caller passes it.
embeddings = ["sentence-transformers"]
dev = ["pytest", "pytest-xdist", "hypothesis"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The metric table ships inside the package: load_metric_table() reads it as package data.
"mailroom_dojo.measures" = ["metrics.yaml"]
