# The Dojo's metric table: one row per metric, flat and versioned.
#
# It keeps every metric of the old Dojo's registry (llm-dojo-scoring 0.30.1, commit
# 23f8234c, metrics/registry.py) under the same id and with the same description,
# unit, aggregation, applicable agents, ground-truth requirement, citation and
# inclusion rule, so a number means the same before and after cutover. Rows with
# `origin: golden` are metrics the old golden baseline (tests/fixtures/golden/scores.json)
# emits that the old registry never listed. `load_metric_table()` reads and validates
# this file; its content hash goes on every scorecard. Change a meaning only with an
# entry in packages/dojo/docs/score-changelog.md, and bump `version` on every change (the
# version and content hash are frozen in tests/fixtures/measures/table_identity.json).
#
# Columns (required unless a default is given):
#   id            the old registry name, unchanged
#   description, unit, aggregation, ground_truth, citation, inclusion, notes
#                 verbatim from the old registry (citation and inclusion merged from the
#                 old metric_meta.py); ground_truth null = the old registry left it unset,
#                 read as unknown (it may need labels: check() refuses label_status none
#                 for it). The nine kept numeric rows it left unset or never listed state it
#                 here (tests/test_metric_table_parity.py, GROUND_TRUTH_STATED); null stays
#                 on structure rows and dropped rows.
#                 Units are a closed vocabulary (table.UNITS), the old ones normalised:
#                 usd is USD, int is count, and the three structure rows
#                 (confusion_matrix, per_class_stats, bootstrap_ci) are structure, not
#                 float[0,1] (tests/test_metric_table_parity.py, UNIT_NORMALISED)
#   agents        as the old registry wrote them; family tokens expand through
#                 agent_families below (the old roster, frozen)
#   direction     higher | lower | none, stated per row; this column is the source of
#                 truth and nothing derives it. New here: the old registry stated no
#                 direction, so every value is proposed for the owner to confirm. none is
#                 for descriptive behaviour rates and resource readings (audit, intake and
#                 routing rates, token counts, GPU readings), and always for a row whose unit
#                 is not a number (structure, tag, text), which also has no pairing and is
#                 never a default view or guard. A row the keep rule reads,
#                 and a metric an agent's default view or guard uses, has a direction other
#                 than none. Every value is frozen in
#                 tests/fixtures/measures/metric_directions.json; a lint in
#                 tests/test_metric_directions.py compares each with what the id's words
#                 suggest and lists the disagreements, which must be the reviewed ones in
#                 that fixture's name_rule_exceptions (each with its reason).
#   headline      true exactly for the old tier-0 metrics (tiers are gone)
#   metric_id     the old canonical comparison id (docs/contracts/METRIC_IDS.md), else
#                 registry:<id>, as the old emitter stamped it
#   layer         which part of the new Dojo produces it: an existing module
#                 (classification, field_scoring) or the build chunk that will
#                 (D1 statistics, D3b tasks and suites, D4 label layer, D5 run layer,
#                 D6 outcome and behaviour, D7 compare, stability, cost truth, log
#                 health); null when not ported
#   status        implemented (producer names the function) | planned | not_ported.
#                 A metric is kept (implemented or planned) only when a named reader
#                 uses it: the master design's rule that a module survives only if a
#                 gate, a report or a projection reads its output. Every other old id
#                 stays as a not_ported row with its meaning, so it can be revived.
#   readers       default []; required for implemented and planned rows, empty for
#                 not_ported. The readers, and where the designs name them:
#                   golden_parity_gate   the D3b gate: the old golden scores.json is
#                                        reproduced (port design, section 6; master
#                                        design, stage 2 gate "golden cases unchanged")
#                   archive_gate         the sandbox's production slice gate, ported in
#                                        D6 (local-mailroom-sandbox job/gate.py: pass
#                                        rule, wrong-archive and review rates with
#                                        Wilson 95% upper bounds, no judge_error)
#                   headline_view        the headline dashboard query (port design 4.2)
#                   keep_rule            the autoresearch keep rule: paired gain over the
#                                        noise floor, no class worse (master design,
#                                        "Comparing runs" and "Prompt optimization")
#                   specialist_report    R2: per field and per class, coverage and
#                                        precision apart (master design, R2 item 1)
#                   classification_report R3: class accuracy, silent-wrong, cost per
#                                        classification (master design, R2/R3 item 2)
#                   merger_report        per MAUD question, coverage and precision apart
#                                        (master design, "Mergers")
#                   behaviour_report     was each oversight step right, retries
#                                        (master design, "What it scores", Behavior)
#                   confidence_report    calibration error per agent (same table)
#                   run_report           run layer: schema adherence, cost, serving
#                                        figures by backend (same table, Run)
#                   cost_truth_report    token-priced estimate against the bill (same
#                                        table, Cost truth)
#                   run_comparison       bootstrap intervals for differences (master
#                                        design, "Comparing runs")
#                   cost_projection      cost for larger volumes (master design,
#                                        "Projections")
#                   set_a_report, set_c_report, set_e_report
#                                        what the Dojo must produce for experiment Sets
#                                        A, C and E (master design, the Sets table)
#                   log_health_report    share of steps with complete entries and chain
#                                        verification (master design, Log health)
#                   gold_generation      the future step that generates additional gold
#                                        for evaluation (owner decision 2026-11-18; a
#                                        paid run behind the spend gate, not built yet)
#   status_reason default null; required for not_ported (which design rule drops it)
#   producer      default null; the new function that computes it today
#   cost          default false; true when the value is money spent (a Measure of it
#                 needs a cost basis other than none)
#   pairing       default null; how two runs' values are compared, one of the tests D1
#                 implements (table.PAIRING_METHODS): paired_percentile_bootstrap (D1
#                 paired_bootstrap_delta: per-document values over the same documents,
#                 paired by document id, the design's "Comparing runs") or
#                 two_sample_percentile_bootstrap (D1 delta_significance, the old
#                 compare_serving on latencies). Required on every kept headline row,
#                 every row the keep rule reads, and every metric a default view shows
#                 (as its number or its guard), unless pairing_note says why not.
#   pairing_note  default null; why such a row has no pairing (a statistic of the whole
#                 set, such as macro F1, a bound, or a share of the run's own decisions)
#   denominator   default null (not stated); what sets the denominator: gold (the
#                 evaluation set: its documents, or those with gold, the same for every
#                 run) or run (the run's own decisions: documents that reached a lane, its
#                 rulings, accepts or archives, a verdict read from its own extraction). A
#                 run row has no pairing (two runs divide by different documents; a
#                 pairing_note says so and D7 builds the resample); every
#                 paired_percentile_bootstrap row states gold. Stated on every paired row
#                 and every kept row whose denominator the run sets
#                 (tests/test_metric_table.py, RUN_DENOMINATOR).
#   noise_floor   default null everywhere, on purpose: the smallest difference that
#                 counts is measured by D7 (repeat runs of one configuration), not
#                 guessed here; the old code and docs define none. Until D7 sets it, a
#                 comparison reports its interval and no "beats the noise" verdict.
#   alias_of      default null; for a not_ported row that is another row's value under
#                 a second name: the kept row it is reported under (no alias and no
#                 duplicate itself; same unit, direction
#                 and aggregation). MetricTable.resolve(id) follows it; check() refuses a
#                 Measure filed under the alias.
#   same_as       default null; a duplicate that keeps its own row (it may be computed at
#                 another level, or is kept for golden parity): the canonical row it
#                 duplicates (same unit and direction; the target is itself canonical and
#                 kept).
#                 Groups: laziness_rate and contracteval_false_no_related ->
#                 false_no_related_rate; schema_adherence -> schema_valid;
#                 expected_field_presence -> field_presence (an alias).
#                 audit_disagreement_rate is 1 - audit_resolution_rate (its status_reason).
#   origin        registry | golden | design. design rows meet a need the master design
#                 names that no old metric meets (metric_id dojo:<id>); each is planned and
#                 its status_reason names its reader. A new rule for an old metric is a design
#                 row too, never an edit of the old row: <old id>_vs_gold carries the decision
#                 agents' gold derived from the label layers, and the old id keeps its old rule.
#
# default_views (top level): the one number each agent's dashboard shows by default
# (the old registry's tier 0, "ONE number per agent on the default view", registry.py
# line 13), with a guard beside it. agent -> {metric, confirmed, source, guard?,
# guard_confirmed?, label_layers, reason?}. The loader checks: every live agent of
# agent_roster has an entry, and no legacy or retired agent has one; the metric and the
# guard are kept rows that apply to the agent and have a direction (never none); the
# guard is not the metric; label_layers names the layers the gold comes from
# (table.LABEL_LAYERS: the labels package's layer kinds hub, interim, near_gold and
# review, or derived_gold alone), empty only for a metric that needs no labels; a view on
# derived_gold shows design rows only (derived gold is a new rule); metric null needs a reason and has no guard
# and no layers. confirmed is true only where the owner decided; every other entry is
# a proposal. The entries are part of the content hash and frozen in
# tests/fixtures/measures/default_views.json.
#   old_source    default null; the old function, relative to llm_dojo_scoring

table_format: 1
version: 2
source:
  old_dojo_commit: "23f8234c3c548bdc203033388bb316e52e588a2c"
  old_dojo_version: "0.30.1"
  old_registry: "llm_dojo_scoring/metrics/registry.py"


agent_families:
  AUDITORS: ["audit_agent", "contract_auditor", "corporate_records_auditor", "due_diligence_auditor", "correspondence_auditor", "compliance_auditor", "court_opinions_auditor", "insurance_claims_auditor", "arbiter"]
  CLASSIFIERS: ["sorter", "sorter_reviewer", "judge"]
  INTAKE: ["intake"]
  LIVE_SPECIALISTS: ["contracts_specialist", "merger_agreement_specialist", "corporate_records_specialist", "correspondence_specialist", "insurance_claims_specialist"]
  SERVING: ["local_vs_api"]
  SPECIALISTS: ["contracts_specialist", "merger_agreement_specialist", "corporate_records_specialist", "due_diligence_specialist", "correspondence_specialist", "compliance_specialist", "court_opinions_specialist", "insurance_claims_specialist"]
  TRANSCRIBERS: ["pdf_transcriber", "image_extractor"]

# agent_roster (top level): every agent a row or family names, and the agents of the
# running pipeline, each with a status (table.AGENT_STATUSES). live = the 16 agents of
# llm-mailroom src/config/taxonomy.yaml (agents:); legacy = the eight auditors, whose rows
# stay for golden parity only; retired = the specialists of classes the pipeline no
# longer routes (history only); procedural, human, comparison and graph_node name an
# entry that is not a model agent.
agent_roster:
  sorter: {status: "live"}
  sorter_reviewer: {status: "live"}
  judge: {status: "live"}
  arbiter: {status: "live"}
  boss: {status: "live"}
  intake: {status: "live"}
  gmail_triage: {status: "live"}
  relations: {status: "live"}
  reporter: {status: "live", note: "procedural: builds the report from the record; makes no model decision"}
  pdf_transcriber: {status: "live"}
  image_extractor: {status: "live"}
  contracts_specialist: {status: "live"}
  merger_agreement_specialist: {status: "live"}
  corporate_records_specialist: {status: "live"}
  correspondence_specialist: {status: "live"}
  insurance_claims_specialist: {status: "live"}
  due_diligence_specialist: {status: "retired", note: "class no longer routed; rows kept for history and golden parity"}
  compliance_specialist: {status: "retired", note: "class no longer routed; rows kept for history and golden parity"}
  court_opinions_specialist: {status: "retired", note: "class no longer routed; rows kept for history and golden parity"}
  audit_agent: {status: "legacy", note: "auditor; rows kept for golden parity only"}
  contract_auditor: {status: "legacy", note: "auditor; rows kept for golden parity only"}
  corporate_records_auditor: {status: "legacy", note: "auditor; rows kept for golden parity only"}
  due_diligence_auditor: {status: "legacy", note: "auditor; rows kept for golden parity only"}
  correspondence_auditor: {status: "legacy", note: "auditor; rows kept for golden parity only"}
  compliance_auditor: {status: "legacy", note: "auditor; rows kept for golden parity only"}
  court_opinions_auditor: {status: "legacy", note: "auditor; rows kept for golden parity only"}
  insurance_claims_auditor: {status: "legacy", note: "auditor; rows kept for golden parity only"}
  archivist: {status: "procedural", note: "files the document; judged by the archive gate's checks"}
  human_review: {status: "human", note: "the people who resolve review items"}
  local_vs_api: {status: "comparison", note: "a serving comparison; the backend is a column of the run, not an agent"}
  classification_arbiter: {status: "graph_node", note: "the graph node that runs the arbiter agent"}

default_views:
  sorter:
    metric: "f1_macro"
    confirmed: true
    guard: "accuracy"
    label_layers: ["hub", "interim", "near_gold", "review"]
    source: "llm_dojo_scoring/metrics/registry.py at 23f8234c, line 308: f1_macro is 'the universal classifier headline'; line 13: tier 0 is ONE number per agent on the default view."
  sorter_reviewer:
    metric: "reviewer_class_accuracy_vs_gold"
    confirmed: false
    guard: "reviewer_wrong_accept_upper_95_vs_gold"
    label_layers: ["derived_gold"]
    source: "llm_dojo_scoring/metrics/registry.py at 23f8234c, lines 352-353 and 370: reviewer_class_accuracy, tier 0, with reviewer_wrong_accept_upper_95 as its guard. Gold derived from the class labels, a new rule, so the view shows their _vs_gold rows (rule in each row's status_reason); the old ids keep the old rule."
  judge:
    metric: "judge_verdict_accuracy_vs_gold"
    confirmed: false
    guard: "judge_escalation_recall_vs_gold"
    label_layers: ["derived_gold"]
    source: "Review of the provisional defaults: f1_macro has no gold for the judge in the new system; the verdict is graded against a verdict derived from the field labels, a new rule, so the view shows the _vs_gold rows (rule in each row's status_reason); judge_verdict_accuracy and judge_escalation_recall keep the old rule."
  arbiter:
    metric: "arbiter_decision_accuracy_vs_gold"
    confirmed: false
    guard: "arbiter_wrongful_accept_rate_vs_gold"
    label_layers: ["derived_gold"]
    source: "llm_dojo_scoring/metrics/registry.py at 23f8234c, lines 526-534: the arbiter's quality metric (tier 1); the arbiter has no tier-0 metric. Gold derived, a new rule, so the view shows the _vs_gold rows (rule in each row's status_reason); the old ids keep the old rule."
  boss:
    metric: "boss_wrongful_approve_rate_vs_gold"
    confirmed: true
    guard: "boss_needless_review_rate_vs_gold"
    guard_confirmed: false
    label_layers: ["derived_gold"]
    source: "Owner decision, 2026-11-18: the boss is judged on wrong approvals. Not extraction_overall_score, which grades the specialist. Gold derived, a new rule, so the view shows the _vs_gold rows (rule in each row's status_reason); boss_wrongful_approve_rate and boss_needless_review_rate keep the old rule (human outcome only)."
  intake:
    metric: "intake_class_accuracy"
    confirmed: true
    label_layers: ["hub", "interim", "near_gold", "review"]
    source: "Owner decision, 2026-11-18: intake is judged only by the accuracy of its triage class against the gold class, with no guard; the clerk diagnostics are not needed to judge intake. Its own row, because the shared ids keep their old meaning: the old intake suite's accuracy is the exact match of the cleaned text and its f1_macro the token F1 (llm_dojo_scoring/pipeline/intake.py at 23f8234c, _score_one)."
  contracts_specialist:
    metric: "extraction_overall_score"
    confirmed: false
    guard: "per_field_scores"
    label_layers: ["hub", "interim", "near_gold", "review"]
    source: "llm_dojo_scoring/metrics/registry.py at 23f8234c, line 326: extraction_overall_score is the 'Specialist headline'; line 13."
  merger_agreement_specialist:
    metric: "extraction_overall_score"
    confirmed: false
    guard: "per_field_scores"
    label_layers: ["hub", "interim", "near_gold", "review"]
    source: "llm_dojo_scoring/metrics/registry.py at 23f8234c, line 326: extraction_overall_score is the 'Specialist headline'; line 13."
  corporate_records_specialist:
    metric: "extraction_overall_score"
    confirmed: false
    guard: "per_field_scores"
    label_layers: ["hub", "interim", "near_gold", "review"]
    source: "llm_dojo_scoring/metrics/registry.py at 23f8234c, line 326: extraction_overall_score is the 'Specialist headline'; line 13."
  insurance_claims_specialist:
    metric: "extraction_f2"
    confirmed: false
    guard: "per_field_scores"
    label_layers: ["hub", "interim", "near_gold", "review"]
    source: "llm_dojo_scoring/metrics/registry.py at 23f8234c, line 344: extraction_f2 is the 'insurance claims board number'; line 13."
  correspondence_specialist:
    metric: "extraction_overall_score"
    confirmed: false
    guard: "per_field_scores"
    label_layers: ["hub", "interim", "near_gold", "review"]
    source: "llm_dojo_scoring/metrics/registry.py at 23f8234c, line 326 (the specialist headline). Not content_topic_f1_macro (line 997): the live correspondence schema has no content_topic field, so a perfect extraction would score 0.0; that row stays for eval-lineage runs."
  local_vs_api:
    metric: "tokens_per_second"
    confirmed: false
    guard: "cost_per_document"
    label_layers: []
    source: "llm_dojo_scoring/metrics/registry.py at 23f8234c, lines 1097-1098: tokens_per_second, tier 0, kept for continuity. The backend is a column of the run, not an agent."
  pdf_transcriber:
    metric: null
    confirmed: true
    reason: "deferred by owner decision"
    source: "Owner decision, 2026-11-18: transcribers are out of scope for this step."
  image_extractor:
    metric: null
    confirmed: true
    reason: "deferred by owner decision"
    source: "Owner decision, 2026-11-18: transcribers are out of scope for this step."
  reporter:
    metric: null
    confirmed: false
    reason: "procedural; no model decision to score"
    source: "Review of the provisional defaults: extraction_overall_score grades the specialist, not the reporter."
  archivist:
    metric: null
    confirmed: false
    reason: "procedural; no model decision to score"
    source: "tests/fixtures/golden/scores.json at 23f8234c: suites.archivist is a cost suite with an empty score; no registry metric names the archivist."
  human_review:
    metric: null
    confirmed: true
    reason: "humans are the gold source"
    source: "Owner decision, 2026-11-18. Wasted review is attributed to the routing policy that sent the document (review_tray_wasted_review_rate), not to the reviewers."
  relations:
    metric: null
    confirmed: false
    reason: "no metric yet: the old registry has none for relations and no reader needs one"
    source: "llm-mailroom src/config/taxonomy.yaml (agents:); llm_dojo_scoring/metrics/registry.py at 23f8234c names no relations metric."
  gmail_triage:
    metric: null
    confirmed: false
    reason: "no metric yet: mail intake ahead of the pipeline; the old registry has none and no reader needs one"
    source: "llm-mailroom src/config/taxonomy.yaml (agents:); llm_dojo_scoring/metrics/registry.py at 23f8234c names no gmail_triage metric."
  classification_arbiter:
    metric: null
    confirmed: false
    reason: "the graph node of the arbiter agent; its decisions are scored under arbiter"
    source: "llm-mailroom src/graph/build_graph.py: classification_arbiter is the node that runs the arbiter agent."

metrics:
  - id: "f1_macro"
    description: "Macro-averaged F1 across classes — the universal classifier headline"
    unit: "float[0,1]"
    direction: "higher"
    aggregation: "mean"
    agents: ["ALL"]
    ground_truth: "required"
    headline: true
    metric_id: "pipeline.classification.f1_macro"
    layer: "classification"
    status: "implemented"
    readers: ["golden_parity_gate", "headline_view"]
    pairing_note: "Macro F1 is a statistic of the whole confusion matrix, not a mean of per-document values, so D1's paired_bootstrap_delta (mean per-document difference) does not apply; a paired document resample that recomputes the statistic on both runs is D7's to build. Compare runs on accuracy (paired) meanwhile."
    producer: "mailroom_dojo.classification.metrics.macro_prf"
    origin: "registry"
    old_source: "classification.macro_prf"
    citation: "Unweighted macro-average of one-vs-rest F1 (classification.macro_prf); F1 is van Rijsbergen Fβ with β=1."
    inclusion: "Computed when expected and predicted label sequences are non-empty. Empty/null labels dropped. score_task drops ERROR_PREFIX rows."
  - id: "accuracy"
    description: "Overall exact-match accuracy"
    unit: "float[0,1]"
    direction: "higher"
    aggregation: "mean"
    agents: ["ALL"]
    ground_truth: "required"
    headline: true
    metric_id: "pipeline.classification.accuracy"
    layer: "classification"
    status: "implemented"
    readers: ["golden_parity_gate", "headline_view", "classification_report"]
    pairing: "paired_percentile_bootstrap"
    producer: "mailroom_dojo.classification.metrics.accuracy"
    denominator: "gold"
    origin: "registry"
    old_source: "classification.accuracy"
    citation: "Exact-match accuracy after task-aware normalize_label (classification.accuracy)."
    inclusion: "Computed when expected and predicted label sequences are non-empty. Empty/null labels dropped."
  - id: "extraction_overall_score"
    description: "Specialist headline: overall extraction score for the run"
    unit: "float[0,1]"
    direction: "higher"
    aggregation: "mean"
    agents: ["SPECIALISTS", "reporter", "boss"]
    ground_truth: "required"
    headline: true
    metric_id: "pipeline.extraction.overall"
    layer: "field_scoring"
    status: "implemented"
    readers: ["golden_parity_gate", "headline_view", "specialist_report", "keep_rule", "set_c_report"]
    pairing: "paired_percentile_bootstrap"
    producer: "mailroom_dojo.field_scoring.extraction.score_extraction"
    denominator: "gold"
    origin: "registry"
    old_source: "field_scoring.score_extraction"
    citation: "Mean of per-field typed scores from field_scoring.score_extraction (soft mean; partial list credit stays here)."
    inclusion: "None when there are no scorable fields. Empty/null expected dict yields no overall score."
  - id: "extraction_f1"
    description: "Field-micro F1 over (field, value) events (ACE / CoNLL / SemEval slot filling)"
    unit: "float[0,1]"
    direction: "higher"
    aggregation: "mean"
    agents: ["SPECIALISTS"]
    ground_truth: "required"
    headline: true
    metric_id: "pipeline.extraction.field_micro_f1"
    layer: "D3b"
    status: "planned"
    readers: ["golden_parity_gate", "headline_view"]
    pairing_note: "Field-micro F1 pools true positives, false positives and false negatives over every document of the run before dividing (old suites.py merge_extraction_counts, extraction_metrics.extraction_binary_metrics), so it is a statistic of the whole set, not a mean of per-document values, and D1's paired_bootstrap_delta does not apply; a paired document resample that recomputes the pooled F1 on both runs is D7's to build. Compare runs on extraction_overall_score (paired) meanwhile."
    origin: "registry"
    old_source: "extraction_metrics.extraction_binary_metrics"
    citation: "ACE / CoNLL / SemEval slot filling; TP requires typed score ≥ 1.0. F1 is van Rijsbergen β=1."
    inclusion: "Skipped when expected is empty/null. Empty GT field values are not FN. List F1 is None if no list fields. A schema field the GT does not label is excluded on both sides (a value there is not an FP); with no labelled field the suite reports P/R/F1/F2 as null."
  - id: "extraction_f2"
    description: "Field-micro F2 (β=2, van Rijsbergen) — recall-weighted; insurance claims board number"
    unit: "float[0,1]"
    direction: "higher"
    aggregation: "mean"
    agents: ["SPECIALISTS"]
    ground_truth: "required"
    headline: true
    metric_id: "pipeline.extraction.field_micro_f2"
    layer: "D3b"
    status: "planned"
    readers: ["golden_parity_gate", "headline_view"]
    pairing_note: "Field-micro F2 pools true positives, false positives and false negatives over every document of the run before dividing (old suites.py merge_extraction_counts, extraction_metrics.extraction_binary_metrics), so it is a statistic of the whole set, not a mean of per-document values, and D1's paired_bootstrap_delta does not apply; a paired document resample that recomputes the pooled F2 on both runs is D7's to build. Compare runs on extraction_overall_score (paired) meanwhile."
    origin: "registry"
    old_source: "extraction_metrics.extraction_binary_metrics"
    citation: "ACE / CoNLL / SemEval slot filling; F2 is van Rijsbergen Fβ with β=2 (5PR/(4P+R))."
    inclusion: "Same inclusion as extraction_f1. Partial list matches are not TP."
    notes: "Partial list matches are not TP; they stay in extraction_overall_score"
  - id: "reviewer_class_accuracy"
    description: "Reviewer class accuracy against verified targets"
    unit: "float[0,1]"
    direction: "higher"
    aggregation: "mean"
    agents: ["sorter_reviewer"]
    ground_truth: "required"
    headline: true
    metric_id: "review.lane.class_accuracy"
    layer: "D6"
