# Hooks run on `git commit` after `make hooks`. Revisions are released tags, kept in step with
# the tool pins in the Makefile (DEV_TOOLS). Run every hook by hand: pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: local
    hooks:
      - id: no-session-links
        name: no session links in tracked files or branch commits
        entry: scripts/check_no_session_links.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: no-session-links-message
        name: no session links in the commit message
        entry: scripts/check_no_session_links.sh
        language: script
        stages: [commit-msg]
